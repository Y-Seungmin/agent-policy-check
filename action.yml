name: policy-check
description: Deterministically enforce repository-defined pull request policies
author: AS1HK
inputs:
  github-token:
    description: GitHub token used to read pull request files and trusted base-commit policy files
    required: true
outputs:
  result:
    description: Final policy result (passed, failed, or skipped)
  violation-count:
    description: Number of policy rules that were violated
runs:
  using: node24
  main: dist/index.js
branding:
  icon: shield
  color: blue
