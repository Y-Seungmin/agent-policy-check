<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">agent-policy-check deterministic pull request gate</title>
  <desc id="desc">A pull request flows through changed paths and repository policy rules to a pass or fail result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="760" height="180" rx="18" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <g fill="#dbeafe" font-size="15" font-weight="700">
      <text x="96" y="55">PULL REQUEST</text>
      <text x="280" y="55">CHANGED PATHS</text>
      <text x="465" y="55">POLICY RULES</text>
      <text x="664" y="55">RESULT</text>
    </g>
    <g fill="#93c5fd" font-size="12">
      <text x="96" y="80">opened / updated</text>
      <text x="280" y="80">src/auth/**</text>
      <text x="465" y="80">tests + owners</text>
      <text x="664" y="80">pass or fail</text>
    </g>
  </g>
  <g stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M150 116H225"/><path d="M335 116H410"/><path d="M520 116H595"/>
  </g>
  <g fill="#34d399">
    <circle cx="150" cy="116" r="6"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="335" cy="116" r="6"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" begin=".45s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="116" r="6"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" begin=".9s" repeatCount="indefinite"/></circle>
  </g>
  <text x="380" y="155" fill="#bfdbfe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">same inputs → same decision</text>
</svg>
